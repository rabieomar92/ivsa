 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = athena

; Shared configuration for the current firmware variants.
[env:achilles_current]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
; Run production firmware at 80 MHz from framework initialization onward.
; Only the CPU clock is reduced; acquisition and MQTT cadence remain unchanged.
board_build.f_cpu = 80000000L
; PlatformIO compiles every .cpp in src/ by default, and src/main_2.cpp has its
; own setup()/loop(). Exclude it here so the two never link together.
build_src_filter = +<*> -<main_2.cpp>
board_build.embed_files =
	assets/jetbrains_mono_regular.woff2
extra_scripts =
	pre:scripts/generate_serial.py
	post:scripts/erase_before_upload.py
monitor_speed = 115200
monitor_encoding = utf-8
monitor_eol = LF
monitor_rts = 0
monitor_dtr = 0
; Waveshare TTL TO RS485 (C): ESP32 TX GPIO17 -> module RXD,
; ESP32 RX GPIO16 <- module TXD. The converter handles direction automatically.
; External status LED Vin is driven by GPIO25 (HIGH = on).
build_flags =
	-DSENSOR_UART_TX_PIN=17
	-DSENSOR_UART_RX_PIN=16
	-DSENSOR_RS485_AUTO_DIRECTION=1
	-DLED_PIN=25
	-DLED_ACTIVE_LOW=0
	-Wall
	-Wextra
	-Wformat=2
	-Wno-format-nonliteral
; WiFi.h, WebServer.h, and Preferences.h are bundled with the ESP32 Arduino core.
; Only PubSubClient needs an explicit dependency.
lib_deps =
	knolleary/PubSubClient @ 2.8.0
	bblanchon/ArduinoJson @ 6.21.5

; Athena release: verified Achilles base plus current wiring, LED timer,
; RX trace, and live setup status. Environment names remain upload-compatible.
; Keep the archived backup unchanged, including during upload provisioning.
[env:athena]
extends = env:achilles

; Compatibility name for existing upload commands and VS Code selections.
[env:achilles]
extends = env:achilles_current
upload_port = COM5
extra_scripts =
	pre:scripts/original_achilles.py
	post:backups/Achilles/scripts/erase_before_upload.py

; PCB variant: the header labelled RX transmits; the header labelled TX receives.
; Waveshare TTL TO RS485 (C), half-duplex with VCC/GND/TXD/RXD:
; https://www.waveshare.com/ttl-to-rs485-c.htm
; PCB RX (GPIO3) -> converter RXD, PCB TX (GPIO1) <- converter TXD.
; Direction is handled by the converter; no DE/RE GPIO is used.
[env:achilles_invert]
extends = env:achilles_current
; After boot, release UART0 and reserve UART2 for Modbus; no console/debug TX.
; This does not electrically disconnect the board's soldered USB-UART bridge.
build_flags =
	-DSENSOR_UART_TX_PIN=3
	-DSENSOR_UART_RX_PIN=1
	-DSENSOR_ON_PROGRAM_UART_PINS=1
	-DACHILLES_INVERT=1
	-DCORE_DEBUG_LEVEL=0
	-Wall
	-Wextra
	-Wformat=2
	-Wno-format-nonliteral

; VS Code may retain esp32dev as its toolbar environment even after default_envs
; changes. The Upload button must use original Achilles for this target too.
[env:esp32dev]
extends = env:achilles
upload_port = COM5

; Temporary cold-start test with the soldered converter left in place.
; Both UART pins stay inputs; sensor communication is intentionally paused.
; Skip production provisioning/erase hooks to preserve the serial and settings.
[env:achilles_invert_diag]
extends = env:achilles_invert
extra_scripts =
build_flags =
	${env:achilles_invert.build_flags}
	-DACHILLES_INVERT_DIAGNOSTIC=1

; Compare PCB power with STA/MQTT disabled, using the same UART-paused test.
; Saved WiFi/MQTT settings remain in storage and the setup AP stays available.
[env:achilles_invert_ap_diag]
extends = env:achilles_invert_diag
build_flags =
	${env:achilles_invert_diag.build_flags}
	-DACHILLES_AP_ONLY_DIAGNOSTIC=1
