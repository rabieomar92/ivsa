 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
; Run production firmware at 80 MHz from framework initialization onward.
; Only the CPU clock is reduced; acquisition and MQTT cadence remain unchanged.
board_build.f_cpu = 80000000L
; PlatformIO compiles every .cpp in src/ by default, and src/main_2.cpp has its
; own setup()/loop(). Exclude it here so the two never link together.
build_src_filter = +<*> -<main_2.cpp>
board_build.embed_files =
	assets/jetbrains_mono_regular.woff2
extra_scripts =
	pre:scripts/generate_serial.py
	post:scripts/erase_before_upload.py
monitor_speed = 115200
monitor_encoding = utf-8
monitor_eol = LF
monitor_rts = 0
monitor_dtr = 0
; ESP32-WROOM-32U build using the board pins labelled TX/RX.
; TX0 = GPIO1, RX0 = GPIO3. The firmware maps its sensor UART peripheral to
; these pins and disables application Serial logging/commands to keep Modbus clean.
build_flags =
	-DSENSOR_UART_TX_PIN=1
	-DSENSOR_UART_RX_PIN=3
	-DSENSOR_ON_PROGRAM_UART_PINS=1
	-Wall
	-Wextra
	-Wformat=2
	-Wno-format-nonliteral
; WiFi.h, WebServer.h, and Preferences.h are bundled with the ESP32 Arduino core.
; Only PubSubClient needs an explicit dependency.
lib_deps =
	knolleary/PubSubClient @ 2.8.0
	bblanchon/ArduinoJson @ 6.21.5

; Compile this environment to validate or produce the example alternate sensor
; profile. Edit SENSOR_PROFILE_CUSTOM in include/sensor_profile.h first.
[env:esp32dev-custom-profile]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DSENSOR_PROFILE_CUSTOM=1

; -----------------------------------------------------------------------------
; MINIMAL AP TEST  --  builds src/main_2.cpp ONLY.
;
;   VSCode: pick "ap-test" in the PlatformIO environment selector, then Upload
;   Terminal: pio run -e ap-test -t upload
;
; No sensor, no Modbus, no MQTT, no STA. GPIO1/GPIO3 are explicitly left as
; inputs so this image can isolate UART-output contention during thermal tests.
; -----------------------------------------------------------------------------
[env:ap-test]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.f_cpu = 80000000L
build_src_filter = -<*> +<main_2.cpp>
monitor_speed = 115200
monitor_encoding = utf-8
monitor_eol = LF
monitor_rts = 0
monitor_dtr = 0
extra_scripts =
	post:scripts/erase_before_upload.py
build_flags =
	-Wall
	-Wextra
